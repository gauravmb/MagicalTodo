name: Main

on:
  push:
    branches: [main]

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint-build-unit-tests:
    name: Lint · Build · Unit Tests
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Install Fastlane
        run: brew install fastlane

      - name: Run CI lane
        run: fastlane ci
        working-directory: my-first-spec-test

      - name: Upload unit test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: my-first-spec-test/fastlane/unit-test-results.xml
          retention-days: 7

  ui-tests:
    name: UI Tests
    runs-on: macos-15
    needs: lint-build-unit-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install Fastlane
        run: brew install fastlane

      - name: Run UI tests lane
        run: fastlane ui_tests
        working-directory: my-first-spec-test

      - name: Upload UI test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: my-first-spec-test/fastlane/ui-test-results.xml
          retention-days: 7
