name: Main

on:
  push:
    branches: [main]

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint-build-unit-tests:
    name: Lint · Build · Unit Tests
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Generate Xcode project
        run: xcodegen generate
        working-directory: my-first-spec-test

      - name: SwiftLint
        run: swiftlint lint --strict
        working-directory: my-first-spec-test

      - name: Build
        run: |
          xcodebuild build \
            -project TodoApp.xcodeproj \
            -scheme TodoApp \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.0' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty
        working-directory: my-first-spec-test

      - name: Unit Tests
        run: |
          xcodebuild test \
            -project TodoApp.xcodeproj \
            -scheme TodoApp \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.0' \
            -only-testing:TodoAppTests \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty
        working-directory: my-first-spec-test

      - name: Upload unit test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: my-first-spec-test/build/reports/
          retention-days: 7

  ui-tests:
    name: UI Tests
    runs-on: macos-15
    needs: lint-build-unit-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate
        working-directory: my-first-spec-test

      - name: Boot simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep 'iPhone 16 (' | head -1 | grep -E -o '[0-9A-F-]{36}')
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: UI Tests
        run: |
          xcodebuild test \
            -project TodoApp.xcodeproj \
            -scheme TodoApp \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.0' \
            -only-testing:TodoAppUITests \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty
        working-directory: my-first-spec-test

      - name: Upload UI test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: my-first-spec-test/build/reports/
          retention-days: 7
