name: TodoApp
options:
  bundleIdPrefix: com.todoapp
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_PREVIEWS: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  TodoApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TodoApp
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.todoapp.TodoApp
        PRODUCT_NAME: TodoApp
        INFOPLIST_FILE: TodoApp/Supporting/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_PREVIEWS: YES
        DEVELOPMENT_TEAM: ""
      configs:
        Debug:
          DEBUG_INFORMATION_FORMAT: dwarf
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          SWIFT_OPTIMIZATION_LEVEL: "-O"
    preBuildScripts:
      - script: |
          SWIFTLINT=/opt/homebrew/bin/swiftlint
          if [ -f "$SWIFTLINT" ]; then
            "$SWIFTLINT"
          elif which swiftlint > /dev/null; then
            swiftlint
          else
            echo "warning: SwiftLint not installed. Run: brew install swiftlint"
          fi
        name: "SwiftLint"
        basedOnDependencyAnalysis: false

  TodoAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TodoAppTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.todoapp.TodoAppTests
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      - target: TodoApp

  TodoAppUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TodoAppUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.todoapp.TodoAppUITests
        SWIFT_VERSION: "6.0"
        TEST_TARGET_NAME: TodoApp
    dependencies:
      - target: TodoApp
